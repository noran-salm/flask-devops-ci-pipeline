---
- name: Deploy Flask Application to EC2
  hosts: all
  become: true
  vars:
    app_dir: "/home/ubuntu/app"

  tasks:
    - name: Ensure deployment directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copy docker-compose.yml to target host
      ansible.builtin.copy:
        src: ../docker-compose.yml
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    - name: Check if nginx.conf path is a directory
      ansible.builtin.stat:
        path: "{{ app_dir }}/nginx.conf"
      register: nginx_conf_stat

    - name: Auto-remove nginx.conf directory if created by Docker
      ansible.builtin.file:
        path: "{{ app_dir }}/nginx.conf"
        state: absent
      when: nginx_conf_stat.stat.exists and nginx_conf_stat.stat.isdir

    - name: Copy nginx.conf to target host
      ansible.builtin.copy:
        src: ../nginx.conf
        dest: "{{ app_dir }}/nginx.conf"
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    - name: Log in to Docker Hub
      community.docker.docker_login:
        username: "{{ docker_username }}"
        password: "{{ docker_token }}"

    - name: Pull latest SHA-tagged image and deploy via Docker Compose
      ansible.builtin.shell: |
        cd {{ app_dir }}
        export DOCKER_USERNAME="{{ docker_username }}"
        export IMAGE_TAG="{{ image_tag }}"
        docker compose pull
        docker compose up -d --remove-orphans

    - name: Wait for application to warm up
      ansible.builtin.pause:
        seconds: 5

    - name: Perform Smoke Test on Nginx Proxy (Port 80)
      ansible.builtin.uri:
        url: "http://localhost:80/health"
        status_code: 200
        return_content: yes
      register: health_check
      ignore_errors: true

    - name: Fetch Docker logs if Smoke Test failed
      ansible.builtin.command: docker logs flask_app
      when: health_check.failed
      register: app_logs

    - name: Display container logs on failure
      ansible.builtin.debug:
        var: app_logs.stdout_lines
      when: health_check.failed

    - name: Fail workflow if Smoke Test failed
      ansible.builtin.fail:
        msg: "CRITICAL: Smoke test failed! Application is not responding on port 80."
      when: health_check.failed