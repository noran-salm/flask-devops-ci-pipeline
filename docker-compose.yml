services:
  web:
    image: ${DOCKER_USERNAME}/flask-app:${IMAGE_TAG}
    container_name: flask_app
    restart: always
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    expose:
      - "5000"
    environment:
      - PORT=5000
      - FAIL_HEALTH=true 

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: always